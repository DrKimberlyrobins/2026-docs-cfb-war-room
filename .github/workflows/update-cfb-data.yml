name: Update 2026 CFB Data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # 1. CHECK OUT REPOSITORY
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Create data folder
        run: mkdir -p data


      # ==========================================
      # 2. DOWNLOAD ADVANCED TEAM STATS
      # ==========================================

      - name: Download 2026 advanced team stats
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CFBD_API_KEY" \
            "https://api.collegefootballdata.com/stats/season/advanced?year=2026&excludeGarbageTime=true" \
            -o data/advanced-2026.json


      - name: Verify advanced stats
        run: |
          echo "Advanced stats file size:"
          wc -c data/advanced-2026.json

          echo "Teams in advanced stats:"
          jq 'length' data/advanced-2026.json

          if [ "$(jq 'length' data/advanced-2026.json)" -eq 0 ]; then
            echo "ERROR: CFBD returned no advanced team data."
            exit 1
          fi


      # ==========================================
      # 3. DOWNLOAD GAME + QUARTER DATA
      # ==========================================

      - name: Download 2026 game data
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CFBD_API_KEY" \
            "https://api.collegefootballdata.com/games?year=2026&seasonType=regular" \
            -o data/games-2026.json
      # ==========================================
      # STRENGTH OF SCHEDULE
      # ==========================================

      - name: Download 2026 FPI and SOS data
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CFBD_API_KEY" \
            "https://api.collegefootballdata.com/ratings/fpi?year=2026" \
            -o data/sos-2026.json

      - name: Verify SOS data
        run: |
          echo "SOS records returned:"
          jq 'length' data/sos-2026.json

          echo "Teams with Strength of Schedule:"
          jq '
            [
              .[]
              | select(.resumeRanks.strengthOfSchedule != null)
            ]
            | length
          ' data/sos-2026.json

          if [ "$(jq 'length' data/sos-2026.json)" -eq 0 ]; then
            echo "ERROR: CFBD returned no SOS data."
            exit 1
          fi

      - name: Verify game data
        run: |
          echo "Game data file size:"
          wc -c data/games-2026.json

          echo "Games returned:"
          jq 'length' data/games-2026.json

          if [ "$(jq 'length' data/games-2026.json)" -eq 0 ]; then
            echo "ERROR: CFBD returned no 2026 games."
            exit 1
          fi


      # ==========================================
      # 4. VERIFY COMPLETED GAMES
      # ==========================================

      - name: Verify completed games have line scores
        run: |
          COUNT=$(jq '
            [
              .[]
              | select(
                  .completed == true
                  and .homeLineScores != null
                  and .awayLineScores != null
                  and (.homeLineScores | length) >= 4
                  and (.awayLineScores | length) >= 4
                )
            ]
            | length
          ' data/games-2026.json)

          echo "Completed games with quarter scoring data:"
          echo "$COUNT"

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: No completed games with quarter scores."
            exit 1
          fi


      # ==========================================
      # 5. BUILD TEAM SCORING PROFILES
      #
      # IMPORTANT:
      # These are OBSERVED averages.
      # They are NOT predictions.
      # ==========================================

      - name: Build 2026 scoring profiles
        run: |
          jq '
            def completed_games:
              [
                .[]
                | select(
                    .completed == true
                    and .homeLineScores != null
                    and .awayLineScores != null
                    and (.homeLineScores | length) >= 4
                    and (.awayLineScores | length) >= 4
                  )
              ];

            def game_rows:
              completed_games
              | map(

                  # HOME TEAM ROW
                  {
                    team: .homeTeam,
                    location: "home",

                    q1Scored:
                      (.homeLineScores[0] // 0),

                    q1Allowed:
                      (.awayLineScores[0] // 0),

                    firstHalfScored:
                      (
                        (.homeLineScores[0] // 0)
                        +
                        (.homeLineScores[1] // 0)
                      ),

                    firstHalfAllowed:
                      (
                        (.awayLineScores[0] // 0)
                        +
                        (.awayLineScores[1] // 0)
                      ),

                    fullScored:
                      (.homePoints // 0),

                    fullAllowed:
                      (.awayPoints // 0)
                  },

                  # AWAY TEAM ROW
                  {
                    team: .awayTeam,
                    location: "away",

                    q1Scored:
                      (.awayLineScores[0] // 0),

                    q1Allowed:
                      (.homeLineScores[0] // 0),

                    firstHalfScored:
                      (
                        (.awayLineScores[0] // 0)
                        +
                        (.awayLineScores[1] // 0)
                      ),

                    firstHalfAllowed:
                      (
                        (.homeLineScores[0] // 0)
                        +
                        (.homeLineScores[1] // 0)
                      ),

                    fullScored:
                      (.awayPoints // 0),

                    fullAllowed:
                      (.homePoints // 0)
                  }

                )

              | flatten;


            game_rows

            | sort_by(.team)

            | group_by(.team)

            | map(

                . as $games

                | {

                    team: $games[0].team,

                    games:
                      ($games | length),


                    # --------------------------
                    # OVERALL 1Q
                    # --------------------------

                    avg1QScored:
                      (
                        $games
                        | map(.q1Scored)
                        | add / length
                      ),

                    avg1QAllowed:
                      (
                        $games
                        | map(.q1Allowed)
                        | add / length
                      ),


                    # --------------------------
                    # OVERALL FIRST HALF
                    # --------------------------

                    avg1HScored:
                      (
                        $games
                        | map(.firstHalfScored)
                        | add / length
                      ),

                    avg1HAllowed:
                      (
                        $games
                        | map(.firstHalfAllowed)
                        | add / length
                      ),


                    # --------------------------
                    # OVERALL FULL GAME
                    # --------------------------

                    avgFullScored:
                      (
                        $games
                        | map(.fullScored)
                        | add / length
                      ),

                    avgFullAllowed:
                      (
                        $games
                        | map(.fullAllowed)
                        | add / length
                      ),


                    # --------------------------
                    # HOME SAMPLE
                    # --------------------------

                    homeGames:
                      (
                        $games
                        | map(select(.location == "home"))
                        | length
                      ),


                    # --------------------------
                    # AWAY SAMPLE
                    # --------------------------

                    awayGames:
                      (
                        $games
                        | map(select(.location == "away"))
                        | length
                      ),


                    # --------------------------
                    # HOME SPLITS
                    # --------------------------

                    home:
                      (
                        $games
                        | map(select(.location == "home"))

                        | if length == 0 then
                            null
                          else
                            {
                              games: length,

                              avg1QScored:
                                (
                                  map(.q1Scored)
                                  | add / length
                                ),

                              avg1QAllowed:
                                (
                                  map(.q1Allowed)
                                  | add / length
                                ),

                              avg1HScored:
                                (
                                  map(.firstHalfScored)
                                  | add / length
                                ),

                              avg1HAllowed:
                                (
                                  map(.firstHalfAllowed)
                                  | add / length
                                ),

                              avgFullScored:
                                (
                                  map(.fullScored)
                                  | add / length
                                ),

                              avgFullAllowed:
                                (
                                  map(.fullAllowed)
                                  | add / length
                                )
                            }
                          end
                      ),


                    # --------------------------
                    # AWAY SPLITS
                    # --------------------------

                    away:
                      (
                        $games
                        | map(select(.location == "away"))

                        | if length == 0 then
                            null
                          else
                            {
                              games: length,

                              avg1QScored:
                                (
                                  map(.q1Scored)
                                  | add / length
                                ),

                              avg1QAllowed:
                                (
                                  map(.q1Allowed)
                                  | add / length
                                ),

                              avg1HScored:
                                (
                                  map(.firstHalfScored)
                                  | add / length
                                ),

                              avg1HAllowed:
                                (
                                  map(.firstHalfAllowed)
                                  | add / length
                                ),

                              avgFullScored:
                                (
                                  map(.fullScored)
                                  | add / length
                                ),

                              avgFullAllowed:
                                (
                                  map(.fullAllowed)
                                  | add / length
                                )
                            }
                          end
                      )

                  }

              )
          ' data/games-2026.json \
          > data/scoring-2026.json


      # ==========================================
      # 6. VERIFY SCORING PROFILE
      # ==========================================

      - name: Verify scoring profiles
        run: |
          echo "Scoring profile file size:"
          wc -c data/scoring-2026.json

          echo "Teams with scoring profiles:"
          jq 'length' data/scoring-2026.json

          echo "Sample team profile:"
          jq '.[0]' data/scoring-2026.json

          if [ "$(jq 'length' data/scoring-2026.json)" -eq 0 ]; then
            echo "ERROR: Scoring profile file is empty."
            exit 1
          fi


      # ==========================================
      # 7. COMMIT ALL DATA FILES
      # ==========================================

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/advanced-2026.json
          git add data/games-2026.json
          git add data/scoring-2026.json
          git add data/sos-2026.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update 2026 CFB data and scoring profiles"
            git push
          fi
